name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `src/generated` is git-ignored, so a fresh checkout has no Prisma
      # client and every type-check would fail to resolve its imports.
      #
      # prisma.config.ts resolves a connection URL eagerly so that a missing
      # credential fails loudly. `generate` never opens a connection, but the
      # config file still has to load, so the variable only needs to exist.
      # Nothing below dials this URL.
      - run: pnpm run prisma:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test
